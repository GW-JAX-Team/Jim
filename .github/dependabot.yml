version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "jim-dev"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:19"
      timezone: "Europe/Amsterdam"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
