ci:
  autoupdate_branch: jim-dev
  skip: [uv-lock, pyright]

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.11.29
    hooks:
      - id: uv-lock
        args: ["--upgrade"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff-check
        args: ["--fix"]
        files: src/
      - id: ruff-format
        files: src/
  
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        files: src/
        require_serial: true
