name: CI

on:
  pull_request:
    branches: [main, jim-dev]
  push:
    branches: [main, jim-dev]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          uv sync --python ${{ matrix.python-version }} --group test --group cross-validation
          if [[ "${{ github.ref }}" == "refs/heads/jim-dev" || "${{ github.base_ref }}" == "jim-dev" ]]; then
            uv pip install git+https://github.com/GW-JAX-Team/flowMC.git@flowMC-dev
            uv pip install git+https://github.com/GW-JAX-Team/ripple.git@ripple-dev
          elif [[ "${{ github.event_name }}" != "release" ]]; then
            uv pip install git+https://github.com/GW-JAX-Team/flowMC.git@main
            uv pip install git+https://github.com/GW-JAX-Team/ripple.git@main
          fi
      - name: Run tests
        run: |
          is_main=false
          [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.base_ref }}" == "main" ]] && is_main=true
          cov_flags=""
          [[ "${{ matrix.python-version }}" == "3.12" ]] && cov_flags="--cov=jimgw --cov-report=term-missing"
          if [[ "$is_main" == "true" ]]; then
            uv run --no-sync pytest $cov_flags tests -v --tb=short
          else
            uv run --no-sync pytest -m "not slow and not integration" $cov_flags tests
          fi
      - name: Upload coverage to Coveralls
        if: matrix.python-version == '3.12'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: uv run --no-sync coveralls

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --python 3.12 --group test
          if [[ "${{ github.ref }}" == "refs/heads/jim-dev" || "${{ github.base_ref }}" == "jim-dev" ]]; then
            uv pip install git+https://github.com/GW-JAX-Team/flowMC.git@flowMC-dev
            uv pip install git+https://github.com/GW-JAX-Team/ripple.git@ripple-dev
          elif [[ "${{ github.event_name }}" != "release" ]]; then
            uv pip install git+https://github.com/GW-JAX-Team/flowMC.git@main
            uv pip install git+https://github.com/GW-JAX-Team/ripple.git@main
          fi
      - name: Run pre-commit (excluding pyright)
        run: SKIP=pyright uv run --no-sync pre-commit run --all-files
      - name: Run pyright
        run: uv run --no-sync pyright src/

  publish:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/project/jimgw/
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  merge-main-to-dev:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: jim-dev
          fetch-depth: 0
      - name: Merge main into jim-dev, or open a PR on conflict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            git push origin jim-dev
          else
            git merge --abort
            existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --base jim-dev --head main --state open --json number --jq '.[0].number // empty')
            if [ -n "$existing" ]; then
              echo "PR #$existing already open for main -> jim-dev merge."
            else
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base jim-dev \
                --head main \
                --title "Merge main into jim-dev after release" \
                --body "Automated merge of main into jim-dev failed due to conflicts. Please resolve manually."
            fi
          fi

  publish-testpypi:
    needs: [test, pre-commit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: testpypi
      url: https://test.pypi.org/project/jimgw/
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Build package
        run: uv build
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TESTPYPI_API_TOKEN }}
          skip-existing: true
